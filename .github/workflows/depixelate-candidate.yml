name: Depixelate Candidate Image

on:
    pull_request:
        branches:
            - depixelate/custom
        types: [opened, reopened, synchronize, edited]

concurrency:
    group: depixelate-candidate-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read
    issues: write
    packages: write
    pull-requests: read

env:
    IMAGE: ghcr.io/depixelate/rsshub
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build-smoke-candidate:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout PR head
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Log in to GHCR
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Use Node.js 24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm i --frozen-lockfile

            - name: Run Depixelate helper tests
              run: pnpm depixelate:test

            - name: Build candidate image
              run: |
                  set -euo pipefail
                  docker buildx build \
                    --load \
                    --platform linux/amd64 \
                    --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
                    --label org.opencontainers.image.revision="${{ github.event.pull_request.head.sha }}" \
                    -t "$IMAGE:candidate-pr-${{ github.event.pull_request.number }}" \
                    .

            - name: Start smoke-test stack
              run: |
                  set -euo pipefail
                  network="rsshub-ci-${GITHUB_RUN_ID}"
                  echo "RSSHUB_CI_NETWORK=$network" >> "$GITHUB_ENV"
                  docker network create "$network"
                  docker run -d --name redis --network "$network" redis:alpine
                  docker run -d --name browserless --network "$network" browserless/chrome
                  docker run -d --name rsshub --network "$network" -p 1200:1200 \
                    -e NODE_ENV=production \
                    -e CACHE_TYPE=redis \
                    -e REDIS_URL=redis://redis:6379/ \
                    -e PLAYWRIGHT_WS_ENDPOINT=ws://browserless:3000 \
                    "$IMAGE:candidate-pr-${{ github.event.pull_request.number }}"
                  for attempt in $(seq 1 60); do
                    if curl -fsS http://127.0.0.1:1200/healthz >/dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker logs rsshub
                  exit 1

            - name: Run smoke tests
              run: pnpm depixelate:smoke -- --base-url http://127.0.0.1:1200

            - name: Push tested candidate image
              run: docker push "$IMAGE:candidate-pr-${{ github.event.pull_request.number }}"

            - name: Report candidate failure
              if: failure()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  FAILURE_TITLE: 'Candidate failure: Depixelate RSSHub image'
              run: pnpm tsx depixelate/scripts/report-ci-failure.ts

            - name: Dump container logs on failure
              if: failure()
              run: |
                  docker logs rsshub || true
                  docker logs redis || true
                  docker logs browserless || true

            - name: Stop smoke-test stack
              if: always()
              run: |
                  docker rm -f rsshub redis browserless || true
                  if [ -n "${RSSHUB_CI_NETWORK:-}" ]; then
                    docker network rm "$RSSHUB_CI_NETWORK" || true
                  fi
