name: Depixelate Publish Tested Image

on:
    pull_request:
        branches:
            - depixelate/custom
        types: [closed]

permissions:
    contents: read
    issues: write
    packages: write

env:
    IMAGE: ghcr.io/depixelate/rsshub
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    publish:
        if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout merge result
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Log in to GHCR
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Promote tested digest
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  source_short="${PR_HEAD_SHA:0:12}"
                  docker buildx imagetools inspect "$IMAGE:candidate-pr-$PR_NUMBER"
                  docker buildx imagetools create \
                    -t "$IMAGE:latest" \
                    -t "$IMAGE:source-$source_short" \
                    "$IMAGE:candidate-pr-$PR_NUMBER"

            - name: Delete candidate tag
              uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f # v1.2.1
              with:
                  package: rsshub
                  delete-tags: candidate-pr-${{ github.event.pull_request.number }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Use Node.js 24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm i --frozen-lockfile

            - name: Close recovered CI failure issues
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm tsx depixelate/scripts/report-ci-success.ts

            - name: Report publish failure
              if: failure()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  FAILURE_TITLE: 'Publish failure: Depixelate RSSHub image'
              run: pnpm tsx depixelate/scripts/report-ci-failure.ts
