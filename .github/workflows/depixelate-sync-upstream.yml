name: Depixelate Sync Upstream

on:
    schedule:
        - cron: '23 9 * * *'
    workflow_dispatch: {}

permissions:
    contents: read
    issues: write
    pull-requests: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.UPSTREAM_SYNC_APP_ID }}
                  private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}

            - name: Checkout custom branch
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: depixelate/custom
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Use Node.js 24
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm i --frozen-lockfile

            - name: Merge upstream into sync branch
              id: merge
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  set -euo pipefail
                  git config user.name "depixelate-upstream-sync[bot]"
                  git config user.email "depixelate-upstream-sync[bot]@users.noreply.github.com"
                  git remote add upstream https://github.com/DIYgod/RSSHub.git || true
                  git fetch origin depixelate/custom
                  git fetch upstream master
                  git push origin refs/remotes/upstream/master:refs/heads/master
                  git checkout -B sync/rsshub-upstream origin/depixelate/custom

                  if git merge --no-edit refs/remotes/upstream/master; then
                    if git diff --quiet origin/depixelate/custom..HEAD; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                    upstream_sha="$(git rev-parse --short=12 refs/remotes/upstream/master)"
                    echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
                    git push --force-with-lease origin HEAD:sync/rsshub-upstream
                  else
                    echo "changed=conflict" >> "$GITHUB_OUTPUT"
                    exit 2
                  fi

            - name: Create or update upstream-sync PR
              if: steps.merge.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  set -euo pipefail
                  title="chore(upstream): merge RSSHub upstream ${{ steps.merge.outputs.upstream_sha }}"
                  body=$'Automated upstream sync for RSSHub.\n\nCandidate CI must build and smoke-test the Docker image before this PR can auto-merge.'
                  gh label create upstream-sync --repo "$GITHUB_REPOSITORY" --color "1d76db" --description "Automated RSSHub upstream sync" || true
                  if gh pr view sync/rsshub-upstream --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    number="$(gh pr view sync/rsshub-upstream --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
                    gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --add-label upstream-sync
                  else
                    url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base depixelate/custom --head sync/rsshub-upstream --title "$title" --body "$body" --label upstream-sync)"
                    number="$(gh pr view "$url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
                  fi
                  gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --merge

            - name: Report upstream sync conflict
              if: failure() && steps.merge.outputs.changed == 'conflict'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  FAILURE_TITLE: 'Upstream sync conflict: RSSHub master'
              run: pnpm tsx depixelate/scripts/report-ci-failure.ts

            - name: Report upstream sync workflow failure
              if: failure() && steps.merge.outputs.changed != 'conflict'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  FAILURE_TITLE: 'Upstream sync failure: RSSHub master'
              run: pnpm tsx depixelate/scripts/report-ci-failure.ts
